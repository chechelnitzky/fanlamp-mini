name: Compilar APK FanLamp Mini

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v4

      - name: Recuperar fuente Android verificada (primera ejecución)
        shell: bash
        run: |
          if test -f bundle/part01.txt; then
            cat bundle/part01.txt bundle/part02.txt bundle/part03.txt bundle/part04.txt bundle/part04b.txt bundle/part05.txt | base64 --decode > /tmp/fanlamp-source.tar.xz
            echo "645c3267e50f03750b289da3a8d6b5cbf8b752c17d476681e952355c42e279d2  /tmp/fanlamp-source.tar.xz" | sha256sum --check
            tar -xJf /tmp/fanlamp-source.tar.xz
            sed -i 's/b.setTextAllCaps(false)/b.setAllCaps(false)/' app/src/main/java/cl/fanlampmini/MainActivity.java
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK Android 35 desde la imagen del runner
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if test -z "$SDKMANAGER"; then echo "No se encontró sdkmanager"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"


      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Comprobar vectores oficiales Bluetooth v1, v2 y v3
        run: |
          mkdir -p tests/build
          javac -d tests/build app/src/main/java/cl/fanlampmini/FanLampCodec.java app/src/main/java/cl/fanlampmini/CapturedControl.java tests/CodecSelfTest.java
          java -cp tests/build CodecSelfTest

      - name: Compilar APK debug
        run: gradle --no-daemon assembleDebug

      - name: Entregar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FanLampMini-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Never publish an ephemeral debug-signed APK: each runner creates its own key.
      - name: Preparar la firma de actualización estable
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          FANLAMP_KEYSTORE_B64: ${{ secrets.FANLAMP_KEYSTORE_B64 }}
          FANLAMP_KEYSTORE_PASSWORD: ${{ secrets.FANLAMP_KEYSTORE_PASSWORD }}
        run: |
          if test -n "$FANLAMP_KEYSTORE_B64" && test -n "$FANLAMP_KEYSTORE_PASSWORD"; then
            printf '%s' "$FANLAMP_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fanlamp-update.p12"
            chmod 600 "$RUNNER_TEMP/fanlamp-update.p12"
            echo 'SIGN_READY=true' >> "$GITHUB_ENV"
          else
            echo 'SIGN_READY=false' >> "$GITHUB_ENV"
            echo '::notice::Se omitió la publicación: configura los secretos de firma estables en GitHub Actions.'
          fi

      - name: Compilar APK release sin firma
        if: env.SIGN_READY == 'true'
        run: gradle --no-daemon assembleRelease

      - name: Firmar y verificar certificado estable
        if: env.SIGN_READY == 'true'
        shell: bash
        env:
          FANLAMP_KEYSTORE_PASSWORD: ${{ secrets.FANLAMP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/35.0.0/apksigner"
          "$SIGNER" sign --ks "$RUNNER_TEMP/fanlamp-update.p12" \
            --ks-type PKCS12 --ks-key-alias fanlamp-mini \
            --ks-pass env:FANLAMP_KEYSTORE_PASSWORD \
            --out FanLampMini-v0.5.0.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$SIGNER" verify --verbose --print-certs FanLampMini-v0.5.0.apk
          rm -f "$RUNNER_TEMP/fanlamp-update.p12"

      - name: Publicar únicamente la APK firmada con certificado persistente
        if: env.SIGN_READY == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 FanLampMini-v0.5.0.apk --clobber
          else
            gh release create v0.5.0 FanLampMini-v0.5.0.apk \
              --title 'FanLamp Mini v0.5.0 – Control en una pantalla' \
              --notes 'Interfaz sin desplazamiento vertical y firma de actualización persistente. Los horarios, el dimmer y las velocidades siguen disponibles.'
          fi
